services:
  test-runner:
    build: .
    env_file: .env
    environment:
      HOST: 0.0.0.0
      PORT: 3000
      HEADED: 'false'
      API_TOKEN: ${API_TOKEN:?Set API_TOKEN in .env before starting Docker}
    ports:
      - '127.0.0.1:3000:3000'
    init: true
    shm_size: '1gb'
    volumes:
      - ./temp-repo:/app/temp-repo
      - ./shared/test-cases:/app/shared/test-cases
